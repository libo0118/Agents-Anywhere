name: HarmonyOS HAP

on:
  workflow_dispatch:
  push:
    branches: [chore/hmo/hap-ci]
    paths:
      - 'harmony/**'
      - '.github/workflows/harmony.yml'

permissions:
  contents: read

concurrency:
  group: harmony-hap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned HarmonyOS packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HARMONY_CLI_TOOLS_VERSION: '26.0.0.821'
    steps:
      - uses: actions/checkout@v4
      # Same SDK and setup action as libo0118/codex-mobile-bridge.
      - name: Verify SDK mirror release reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          actual=$(gh api repos/ErBWs/ohos-sdk/git/ref/tags/26.0.0.821 --jq '.object.sha')
          test "$actual" = '8b294a949bdf7191e1a7ffa878be748c9032983b'
      - name: Set up HarmonyOS CLI tools
        uses: ErBWs/setup-ohos@4dbb63025116eb6165ceac58a4bf47cbdc5ac721
        with:
          version: '26.0.0.821'
          cache: 'true'
      - name: Inspect toolchain and prepare unsigned configuration
        working-directory: harmony
        run: |
          node --version
          ohpm --version
          hvigorw --version
          cat "$HOS_SDK_HOME/default/sdk-pkg.json"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build-profile.json5')
          text = path.read_text()
          reference = '"signingConfig": "default",'
          if text.count(reference) != 1:
              raise RuntimeError('Expected the upstream unsigned signing reference exactly once')
          path.write_text(text.replace(reference, ''))
          PY
      - name: Install HarmonyOS dependencies
        working-directory: harmony
        run: ohpm install --all
      - name: Build HAP and shared modules
        working-directory: harmony
        run: |
          hvigorw --mode project -p product=default -p buildMode=release assembleApp --no-daemon --stacktrace
      - name: Verify and collect packages
        run: |
          python3 - <<'PY'
          import hashlib
          import io
          import json
          import os
          import shutil
          import zipfile
          from pathlib import Path

          root = Path('harmony')
          output = Path('dist/harmony')
          output.mkdir(parents=True, exist_ok=True)
          packages = []
          for module, extension in [('entry', '.hap'), ('session', '.hsp'), ('terminal', '.hsp'), ('files', '.hsp')]:
              candidates = list((root / module / 'build/default/outputs/default').glob('*' + extension))
              if len(candidates) != 1:
                  raise RuntimeError(f'{module}: expected one {extension}, found {candidates}')
              source = candidates[0]
              with zipfile.ZipFile(source) as archive:
                  bad = archive.testzip()
                  if bad:
                      raise RuntimeError(f'{source}: corrupt member {bad}')
                  for member in ['module.json', 'ets/modules.abc', 'resources.index']:
                      if archive.getinfo(member).file_size == 0:
                          raise RuntimeError(f'{source}: empty {member}')
                  manifest = json.loads(archive.read('module.json'))
                  if manifest['app']['bundleName'] != 'com.agentsanywhere.app':
                      raise RuntimeError(f'{source}: unexpected bundle name')
                  if manifest['module']['name'] != module:
                      raise RuntimeError(f'{source}: unexpected module name')
              destination = output / source.name
              shutil.copyfile(source, destination)
              packages.append({'name': destination.name, 'bytes': destination.stat().st_size,
                               'sha256': hashlib.sha256(destination.read_bytes()).hexdigest()})
          apps = list((root / 'build/outputs').rglob('*.app'))
          if len(apps) != 1:
              raise RuntimeError(f'Expected one complete APP bundle, found {apps}')
          with zipfile.ZipFile(apps[0]) as archive:
              if archive.testzip():
                  raise RuntimeError('Corrupt APP bundle')
              bundled = set()
              for name in archive.namelist():
                  if Path(name).suffix not in ('.hap', '.hsp'):
                      continue
                  with zipfile.ZipFile(io.BytesIO(archive.read(name))) as module_archive:
                      manifest = json.loads(module_archive.read('module.json'))
                      if manifest['app']['bundleName'] != 'com.agentsanywhere.app':
                          raise RuntimeError(f'APP contains unexpected bundle: {name}')
                      bundled.add(manifest['module']['name'])
              if bundled != {'entry', 'session', 'terminal', 'files'}:
                  raise RuntimeError(f'APP has unexpected module set: {bundled}')
          destination = output / 'Agents-Anywhere-HarmonyOS-unsigned.app'
          shutil.copyfile(apps[0], destination)
          packages.append({'name': destination.name, 'bytes': destination.stat().st_size,
                           'sha256': hashlib.sha256(destination.read_bytes()).hexdigest()})
          (output / 'SHA256SUMS.txt').write_text(''.join(f"{p['sha256']}  {p['name']}\n" for p in packages))
          sdk = json.loads((Path(os.environ['HOS_SDK_HOME']) / 'default/sdk-pkg.json').read_text())
          info = {'repository': os.environ['GITHUB_REPOSITORY'], 'commit': os.environ['GITHUB_SHA'],
                  'run': os.environ['GITHUB_RUN_ID'], 'signed': False,
                  'cliToolsVersion': os.environ['HARMONY_CLI_TOOLS_VERSION'], 'sdk': sdk, 'packages': packages}
          (output / 'build-info.json').write_text(json.dumps(info, ensure_ascii=False, indent=2) + '\n')
          (output / 'INSTALL.txt').write_text(
              'Agents Anywhere / com.agentsanywhere.app\n'
              'Unsigned build: sign with your own HarmonyOS developer certificate and device profile before installation.\n'
              'The entry HAP requires session, terminal and files HSPs. Sign all four modules with the same identity.\n'
              'The APP archive contains all four modules. Do not install the entry HAP alone.\n'
              'After signing: hdc install entry-signed.hap session-signed.hsp terminal-signed.hsp files-signed.hsp\n'
              'Compilation and archive checks do not replace real-device testing.\n')
          print(json.dumps(info, ensure_ascii=False, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### HarmonyOS unsigned build\n\nDownload **Agents-Anywhere-HarmonyOS-unsigned** below.\n\n')
              summary.write('Includes the entry HAP, three required HSPs, a complete APP archive, SHA-256 checksums and build metadata.\n\n')
              summary.write('Device installation requires signing all modules for your device. No real-device test was performed.\n\n')
              summary.write('| File | Bytes |\n| --- | ---: |\n')
              for package in packages:
                  summary.write(f"| {package['name']} | {package['bytes']} |\n")
          PY
      - name: Upload HAP and required shared modules
        uses: actions/upload-artifact@v4
        with:
          name: Agents-Anywhere-HarmonyOS-unsigned
          path: dist/harmony/
          if-no-files-found: error
          retention-days: 30
